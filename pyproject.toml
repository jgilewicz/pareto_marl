[project]
name = "pareto-marl"
version = "0.1.0"
description = "Does the actuator partition matter for MAPPO on MaMuJoCo Ant?"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "gymnasium==1.4.0",
    "gymnasium-robotics==1.4.2",
    "matplotlib==3.11.2",
    "mujoco==3.15.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "torch==2.14.1",
    "wandb==0.30.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "ty==0.0.85"]
reference = ["tensorboard==2.21.0", "tyro==1.0.16"]

[tool.uv]
default-groups = ["dev", "reference"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build==0.11.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 100

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
"reference/*" = ["ALL"]

[tool.ty.src]
exclude = ["reference"]

[tool.pytest.ini_options]
addopts = "-q"
