[project]
name = "pareto-marl"
version = "0.1.0"
description = "Does the actuator partition matter for MAPPO on MaMuJoCo ManySegmentAnt?"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "flax==0.12.10",
    "gymnasium==1.4.0",
    "gymnasium-robotics==1.4.2",
    "jax==0.11.2; sys_platform == 'darwin'",
    "jax[cuda12]==0.11.2; sys_platform == 'linux'",
    "matplotlib==3.11.2",
    "mujoco==3.15.0",
    "mujoco-mjx==3.15.0",
    "numpy==2.5.3",
    "optax==0.2.8",
    "scipy==1.18.1",
    "torch==2.14.1",
    "wandb==0.30.0",
]

[dependency-groups]
dev = ["ruff==0.16.10", "ty==0.0.85"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build==0.11.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 100
