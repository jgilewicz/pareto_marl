const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const LEGS = [[0,1,"front-right"],[2,3,"front-left"],[4,5,"back-left"],[6,7,"back-right"]];
const fmt = (v, d = 0) => v.toLocaleString("en-US", {maximumFractionDigits: d, minimumFractionDigits: d});
const fmtP = p => p < 0.001 ? p.toExponential(1) : p.toFixed(3);
const el = (tag, attrs = {}, html = "") => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (html) e.innerHTML = html;
  return e;
};

function chip(key) {
  const legs = LEGS.map(([a, b, name]) =>
    `<span class="leg" title="${name}">${[a, b].map(i =>
      `<span class="cell" style="background:var(${SERIES[+key[i]]})">${key[i]}</span>`
    ).join("")}</span>`).join("");
  return `<span class="chip" aria-label="partition ${key}">${legs}</span>`;
}

const tip = document.getElementById("tip");
function bindTip(node, text) {
  const show = e => {
    tip.textContent = text; tip.hidden = false;
    const r = node.getBoundingClientRect();
    tip.style.left = Math.min(r.left + 12, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = (r.top - tip.offsetHeight - 6) + "px";
  };
  node.addEventListener("mouseenter", show);
  node.addEventListener("focus", show);
  node.addEventListener("mouseleave", () => tip.hidden = true);
  node.addEventListener("blur", () => tip.hidden = true);
}

function renderVerdict() {
  const v = DATA.verdict, m = DATA.meta, r = DATA.rule;
  const ks = Object.entries(v.per_k);
  const passing = ks.filter(([, x]) => x.go).map(([k]) => "K=" + k);
  const sentence = v.go
    ? `The partition explains a real share of the return variance at ${passing.join(" and ")}. Searching over partitions has something to find.`
    : `At neither K does the partition explain enough of the return variance to clear the pre-registered rule. With this many seeds, only K appears to matter.`;
  const rows = ks.map(([k, x]) => `<tr>
      <td class="num">K=${k}</td><td class="num r">${x.n_partitions}</td>
      <td class="num r">${fmt(x.f_stat, 2)}</td><td class="num r">${fmtP(x.p_value)}</td>
      <td class="num r">${fmt(x.icc, 2)}</td>
      <td>${x.go ? '<span class="pill go">✓ passes</span>' : '<span class="pill nogo">✕ fails</span>'}</td></tr>`).join("");
  document.getElementById("verdict").innerHTML = `
    <div class="verdict-top">
      <span class="stamp ${v.go ? "go" : "nogo"}">${v.go ? "GO" : "NO-GO"}</span>
      <p>${sentence}</p>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Agents</th><th class="r">Partitions</th><th class="r">ANOVA F</th>
        <th class="r">p</th><th class="r">ICC(1)</th><th>Rule</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="small muted">Rule fixed before the run: GO if, for K=2 or K=4, one-way ANOVA
      over partitions gives p &lt; ${r.p} and ICC(1) ≥ ${r.icc} (at least ${r.icc * 100}% of the
      eval-return variance comes from the partition). ${m.n_seeds} seeds per partition,
      ${fmt(m.total_steps / 1e6, 0)}M environment steps each.</p>`;
}

function domain() {
  const all = DATA.partitions.flatMap(p => p.returns);
  const lo = Math.min(0, ...all), hi = Math.max(...all);
  const step = niceStep((hi - lo) / 5);
  return [Math.floor(lo / step) * step, Math.ceil(hi / step) * step, step];
}
function niceStep(raw) {
  const mag = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
}

function renderStrips() {
  const [lo, hi, step] = domain();
  const pct = v => ((v - lo) / (hi - lo)) * 100;
  const single = DATA.partitions.find(p => p.k === 1);
  const sec = document.getElementById("strips");
  sec.innerHTML = `<div class="head"><h2>Return by partition</h2>
    <p class="muted">Each dot is one seed's evaluation return (10 deterministic episodes).
      The black tick is the mean over seeds; the dashed line is the single-agent mean (K=1).
      Rows are sorted by mean within each K.</p></div>
    <div class="legend-chip small muted">${chip("00112233")}<span>actuator cells in leg order:
      front-right, front-left, back-left, back-right (hip, ankle); colour and digit = agent</span></div>`;
  const ticks = [];
  for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
  const groups = [[2, "K = 2 agents"], [4, "K = 4 agents"], [null, "References"]];
  for (const [k, title] of groups) {
    const rows = DATA.partitions
      .filter(p => k === null ? p.group === "reference" : p.k === k)
      .sort((a, b) => b.return_mean - a.return_mean);
    if (!rows.length) continue;
    const verdictK = k && DATA.verdict.per_k[k];
    const panel = el("div", {class: "panel"});
    panel.innerHTML = `<div class="panel-head"><h3>${title}</h3>${verdictK
      ? `<span class="small muted num">ICC ${fmt(verdictK.icc, 2)} · p ${fmtP(verdictK.p_value)}</span>` : ""}</div>`;
    const strip = el("div", {class: "strip"});
    const axis = `<span></span><span class="lab"></span><div class="axis">${ticks.map(t =>
      `<span style="left:${pct(t)}%">${fmt(t)}</span>`).join("")}</div><span></span>`;
    strip.insertAdjacentHTML("beforeend", axis);
    for (const p of rows) {
      const colour = p.group === "random" ? "var(--random)" : p.group === "structured" ? "var(--accent)" : "var(--ink)";
      const sd = p.return_std;
      const track = el("div", {class: "track"});
      track.innerHTML = ticks.map(t => `<span class="gridline" style="left:${pct(t)}%"></span>`).join("")
        + (single ? `<span class="refline" style="left:${pct(single.return_mean)}%"></span>` : "")
        + `<span class="band" style="left:${pct(p.return_mean - sd)}%;width:${pct(p.return_mean + sd) - pct(p.return_mean - sd)}%;background:${colour}"></span>`
        + `<span class="mean" style="left:${pct(p.return_mean)}%"></span>`;
      p.returns.forEach((r, i) => {
        const d = el("span", {class: "dot", tabindex: "0", style: `left:${pct(r)}%;background:${colour}`});
        bindTip(d, `${p.x} · seed ${i} · return ${fmt(r)} · v ${fmt(p.velocities[i], 2)} m/s`);
        track.appendChild(d);
      });
      const row = el("div", {class: "row"});
      row.innerHTML = `<span>${chip(p.x)}</span><span class="lab">${p.label || "random"}<br><span class="key">${p.x}</span></span>`;
      row.appendChild(track);
      row.insertAdjacentHTML("beforeend", `<span class="meanval num">${fmt(p.return_mean)}</span>`);
      strip.appendChild(row);
    }
    panel.appendChild(strip);
    sec.appendChild(panel);
  }
}

function svgFrame(w, h, pad) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${h}`);
  s.setAttribute("class", "chart");
  s.setAttribute("role", "img");
  return s;
}
function linearTicks(lo, hi, n) {
  const step = niceStep((hi - lo) / n), out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out;
}
function axes(svg, xs, ys, sx, sy, W, H, pad, xfmt, yfmt) {
  let g = "";
  ys.forEach(v => g += `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${sy(v)}" y2="${sy(v)}"/>
    <text x="${pad.l - 8}" y="${sy(v) + 4}" text-anchor="end">${yfmt(v)}</text>`);
  xs.forEach(v => g += `<text x="${sx(v)}" y="${H - pad.b + 18}" text-anchor="middle">${xfmt(v)}</text>`);
  g += `<line class="axisline" x1="${pad.l}" x2="${W - pad.r}" y1="${H - pad.b}" y2="${H - pad.b}"/>`;
  svg.insertAdjacentHTML("beforeend", g);
}

function renderFront() {
  const P = DATA.partitions, W = 900, H = 380, pad = {l: 64, r: 24, t: 16, b: 44};
  const xMax = Math.max(...P.map(p => p.actor_params)) * 1.05;
  const yLo = Math.min(0, ...P.map(p => p.return_mean - p.return_std));
  const yHi = Math.max(...P.map(p => p.return_mean + p.return_std));
  const yt = linearTicks(yLo, yHi, 5), xt = linearTicks(0, xMax, 5);
  const y0 = Math.min(yLo, yt[0]), y1 = Math.max(yHi, yt.at(-1));
  const sx = v => pad.l + (v / xMax) * (W - pad.l - pad.r);
  const sy = v => H - pad.b - ((v - y0) / (y1 - y0)) * (H - pad.t - pad.b);
  const sec = document.getElementById("front");
  sec.innerHTML = `<div class="head"><h2>Return against actor size</h2>
    <p class="muted">Actor parameters (f2) cluster by K because each extra agent adds its own
      64×64 network; the ranges for different K never overlap. Points are means over seeds,
      bars are ±1 standard deviation.</p></div>
    <div class="series-legend"><span><i class="swatch dotsw" style="background:var(--ink)"></i>reference (K=1, K=8)</span>
      <span><i class="swatch dotsw" style="background:var(--accent)"></i>structured</span>
      <span><i class="swatch dotsw" style="background:var(--random)"></i>random</span></div>`;
  const panel = el("div", {class: "panel"});
  const svg = svgFrame(W, H);
  svg.setAttribute("aria-label", "Mean eval return against actor parameter count for every partition");
  axes(svg, xt, yt, sx, sy, W, H, pad, v => fmt(v / 1000) + "k", v => fmt(v));
  svg.insertAdjacentHTML("beforeend", `<text x="${W - pad.r}" y="${H - 4}" text-anchor="end">actor parameters</text>`);
  for (const p of [...P].sort((a, b) => (a.group === "random") - (b.group === "random")).reverse()) {
    const c = p.group === "random" ? "var(--random)" : p.group === "structured" ? "var(--accent)" : "var(--ink)";
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("tabindex", "0");
    g.innerHTML = `<line x1="${sx(p.actor_params)}" x2="${sx(p.actor_params)}" y1="${sy(p.return_mean - p.return_std)}"
        y2="${sy(p.return_mean + p.return_std)}" stroke="${c}" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
      <circle cx="${sx(p.actor_params)}" cy="${sy(p.return_mean)}" r="5.5" fill="${c}" stroke="var(--sheet)" stroke-width="2"/>`;
    if (p.group !== "random") {
      g.insertAdjacentHTML("beforeend", `<text x="${sx(p.actor_params) + 9}" y="${sy(p.return_mean) - 8}">${p.x}</text>`);
    }
    bindTip(g, `${p.x} · K=${p.k} · ${fmt(p.actor_params)} params · return ${fmt(p.return_mean)} ± ${fmt(p.return_std)}`);
    svg.appendChild(g);
  }
  panel.appendChild(svg);
  sec.appendChild(panel);
}

      <b>${fmt(ck.cleanrl[0])} <span class="small muted">± ${fmt(ck.cleanrl[1])}</span></b></div>
    <div class="fact"><span class="small muted">Welch t-test, K=1 vs CleanRL</span>
      <b>p = ${fmtP(ck.welch_p)}</b></div></div>
    <p class="small muted">Sanity check: with one agent, MAPPO should train like CleanRL's PPO on the
      same budget and batch shape. A large gap here would mean the implementation, not the partition,
      drives the results.</p>`);
}

function renderTable() {
  const rows = [...DATA.partitions].sort((a, b) => a.k - b.k || b.return_mean - a.return_mean);
  document.getElementById("table").innerHTML = `<div class="head"><h2>All partitions</h2>
    <p class="muted">Forward velocity separates a walking policy from one that stands still and
      collects the survival bonus (about 1 per step).</p></div>
    <div class="panel table-wrap"><table>
      <thead><tr><th>Partition</th><th>K</th><th>Group</th><th class="r">Actor params</th>
        <th class="r">Eval return</th><th class="r">± std</th><th class="r">Forward v (m/s)</th>
        <th class="r">Seeds</th></tr></thead>
      <tbody>${rows.map(p => `<tr><td>${chip(p.x)} <span class="num small muted">${p.x}</span></td>
        <td class="num">${p.k}</td><td>${p.label || p.group}</td>
        <td class="num r">${fmt(p.actor_params)}</td><td class="num r">${fmt(p.return_mean)}</td>
        <td class="num r">${fmt(p.return_std)}</td><td class="num r">${fmt(p.x_velocity_mean, 2)}</td>
        <td class="num r">${p.n_seeds}</td></tr>`).join("")}</tbody></table></div>`;
}

function renderMethod() {
  const m = DATA.meta;
  const missing = m.n_mappo_expected - m.n_mappo;
  document.getElementById("method").innerHTML = `<div class="head"><h2>Method and coverage</h2></div>
    <div class="facts">
      <div class="fact"><span class="small muted">MAPPO runs</span><b>${m.n_mappo} / ${m.n_mappo_expected}</b></div>
      <div class="fact"><span class="small muted">CleanRL runs</span><b>${m.n_cleanrl} / ${m.n_seeds}</b></div>
      <div class="fact"><span class="small muted">Compute</span><b>${m.cpu_hours == null ? "n/a" : fmt(m.cpu_hours, 1) + " CPU-h"}</b></div>
      <div class="fact"><span class="small muted">Generated</span><b class="small">${m.generated}</b></div>
    </div>
    <ul class="notes small">
      ${missing ? `<li><strong>${missing} MAPPO runs are missing</strong>; ANOVA and ICC use the runs present.</li>` : ""}
      <li>Design: K=1 and K=8 references; for K=2 four structured splits (front/back, left/right,
        diagonals, hips/ankles) and eight random ones; for K=4 the per-leg split and eight random ones.
        Random partitions are drawn uniformly among all partitions with that K.</li>
      <li>MAPPO: CleanRL's continuous PPO with the actor split into K independent Gaussian actors on
        local observations (MaMuJoCo, agent_obsk=1), one critic on the full 105-dim state,
        per-agent clipped ratios summed over agents. Hyperparameters fixed, not tuned.</li>
      <li>Evaluation: 10 episodes with the mean action, observation statistics frozen from training.</li>
      <li>ICC(1) = (MSB − MSW) / (MSB + (n−1)·MSW) with n seeds per partition.</li>
      <li>Run ${m.run_id} on WCSS Bem2, one CPU core per run.</li>
    </ul>`;
  document.getElementById("eyebrow").textContent =
    `pareto-marl · run ${m.run_id} · MaMuJoCo Ant-v5 · ${m.n_mappo + m.n_cleanrl} training runs`;
}

renderVerdict(); renderStrips(); renderFront(); renderCurves(); renderTable(); renderMethod();
</script>
